# Reverse proxy (TLS + domain routing).
#
# The auto-deploy webhook receiver runs on the HOST (deploy/webhook.service),
# not here, because it needs docker + git + the Supabase CLI and must avoid
# mounting the docker socket into a container. Caddy reaches it via the host
# gateway (see Caddyfile `deploy.helpdesk.example.com`).
#
#   docker network create edge        # once, before bringing anything up
#   cd /opt/helpdesk/proxy && docker compose up -d

services:
  caddy:
    image: caddy:2
    container_name: edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the Caddyfile via {$VAR}. Values come from deploy/proxy/.env.
      ACME_EMAIL: ${ACME_EMAIL}
      APP_PUBLIC_HOST: ${APP_PUBLIC_HOST}
      SUPABASE_PUBLIC_HOST: ${SUPABASE_PUBLIC_HOST}
      DEPLOY_PUBLIC_HOST: ${DEPLOY_PUBLIC_HOST}
    extra_hosts:
      # Lets the Caddyfile reach the host-based webhook receiver on :9000.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
    name: edge
