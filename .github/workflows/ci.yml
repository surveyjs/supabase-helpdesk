name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PRs: a new push cancels the in-flight run. main: one group per commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Shared setup lives in .github/actions/*. Dependencies are installed without a
# lock file (by design) as of the commit date; the Supabase CLI version is the
# one pinned in package.json ("supabase" script).
jobs:
  lint:
    name: Lint · typecheck · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      # Each check runs even if a previous one failed, so one run reports all.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:unit
      - name: Deploy script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash deploy/tests/upgrade.test.sh
      - name: Record resolved dependency versions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          {
            echo "### Dependencies (npm install --before=$(git log -1 --format=%cI))"
            echo '```'
            npm ls --depth=0 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload resolved package-lock.json
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: resolved-package-lock
          path: package-lock.json
          retention-days: 14
          overwrite: true

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Writes package-lock.json: the dependency tree resolved for this commit,
      # which the Dockerfile installs with `npm ci`.
      - uses: ./.github/actions/setup
      - name: docker build
        run: |
          docker build -t supabase-helpdesk:ci --build-arg "HELPDESK_VERSION=sha-$GITHUB_SHA" .
          docker save supabase-helpdesk:ci | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          overwrite: true
          retention-days: 3
          compression-level: 0

  image-smoke:
    name: Image smoke (migrate · startup check)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: docker load
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
      - name: Smoke scenarios
        env:
          IMAGE: supabase-helpdesk:ci
          EXPECTED_VERSION: sha-${{ github.sha }}
        run: bash .github/scripts/image-smoke.sh
      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-image-smoke
          extra-path: ${{ runner.temp }}/image-smoke/out

  db:
    name: DB tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          supabase: 'true'
      - uses: ./.github/actions/supabase-ready
      - name: DB tests
        run: npm run test:db
      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-db

  e2e:
    name: E2E chromium (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SKIP_BUILD: '1'          # run-server.mjs reuses the build below
      SKIP_BUILD_TYPECHECK: '1'    # the lint job already runs tsc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          supabase: 'true'
      - name: Install Chromium (background)
        run: bash .github/scripts/bg.sh start playwright npx playwright install --with-deps --only-shell chromium
      - uses: ./.github/actions/next-build
      - name: Wait for Chromium
        run: bash .github/scripts/bg.sh wait playwright 600
      - uses: ./.github/actions/supabase-ready
      - name: Playwright chromium shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-chromium-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-e2e-chromium-${{ matrix.shard }}

  cross-browser:
    name: E2E firefox + webkit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_SKIP_BUILD: '1'
      SKIP_BUILD_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          supabase: 'true'
      - name: Install Firefox + WebKit (background)
        run: bash .github/scripts/bg.sh start playwright npx playwright install --with-deps firefox webkit
      - uses: ./.github/actions/next-build
        with:
          # Finishes before the slowest shard, so saving the cache here is free.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Wait for browsers
        run: bash .github/scripts/bg.sh wait playwright 600
      - uses: ./.github/actions/supabase-ready
      - name: Playwright firefox + webkit (cross-browser.spec.ts)
        run: npx playwright test --project=firefox --project=webkit
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-cross-browser
          path: blob-report
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-e2e-cross-browser

  e2e-report:
    name: E2E report
    needs: [e2e, cross-browser]
    if: ${{ !cancelled() && (needs.e2e.result == 'failure' || needs.cross-browser.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup     # same --before date => same Playwright as the shards
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge blob reports into one HTML report
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14

  # Upgrades a production-like database (base revision, old default
  # privileges) with the new migrations, the way production applies them.
  # See .github/scripts/migration-upgrade.sh for the rules it enforces.
  migration-upgrade:
    name: Migration upgrade (prod-like)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # base revision + merge-base
          persist-credentials: false
      - id: detect
        name: Detect migration changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/migration-upgrade.sh detect
      - name: Prepare base project (old default privileges)
        if: steps.detect.outputs.changed == 'true'
        run: bash .github/scripts/migration-upgrade.sh prepare
      - if: steps.detect.outputs.changed == 'true'
        uses: ./.github/actions/setup
        with:
          supabase: 'true'
          supabase-workdir: ${{ steps.detect.outputs.workdir }}
      - if: steps.detect.outputs.changed == 'true'
        uses: ./.github/actions/supabase-ready
      - if: steps.detect.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: docker load
        if: steps.detect.outputs.changed == 'true'
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
      - name: Upgrade and verify
        if: steps.detect.outputs.changed == 'true'
        run: bash .github/scripts/migration-upgrade.sh verify
      - name: Upload diagnostics
        if: failure() && steps.detect.outputs.changed == 'true'
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-migration-upgrade
          extra-path: ${{ runner.temp }}/migration-upgrade/out

  ci-result:
    name: ci-result   # the single required status check
    needs: [lint, db, e2e, cross-browser, migration-upgrade, image, image-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result != "success")' > /dev/null; then
            echo "::error::A required job failed, was cancelled or was skipped"
            exit 1
          fi
