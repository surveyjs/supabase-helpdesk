name: Next.js E2E build
description: >
  Restore .next/cache (Turbopack build cache), run `npm run build:e2e`
  (loading .env.test; the browser gets its config from /runtime-config.js), optionally save the cache.
inputs:
  save-cache:
    description: "'true' = save .next/cache after the build (do it from one job only)"
    default: 'false'
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: .next/cache
        # package-lock.json is generated by `npm install`, so it hashes the
        # resolved dependency tree.
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json', '.env.test') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          nextjs-${{ runner.os }}-

    - name: next build
      shell: bash
      run: npm run build:e2e

    - if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .next/cache
        key: ${{ steps.restore.outputs.cache-primary-key }}
